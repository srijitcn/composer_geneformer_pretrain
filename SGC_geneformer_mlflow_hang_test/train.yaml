# - experiment_name: Field required
# - environment: Field required
# - compute.gpu_type: Field required
# - compute.cluster: Extra inputs are not permitted
# - name: Extra inputs are not permitted
# - image: Extra inputs are not permitted
# - integrations: Extra inputs are not permitted
# - scheduling: Extra inputs are not permitted

experiment_name: geneformer-sgc-mlflow-hang-repro
run_name: geneformer-mlflow-hang-test
environment:
  env_variables:
    # NCCL settings for multi-node H100 training
    NCCL_DEBUG: "INFO"
    NCCL_SOCKET_IFNAME: "eth"            # Use eth interfaces (auto-match eth0, eth1, etc.)
    NCCL_IB_DISABLE: "1"                 # Disable InfiniBand if not available
    NCCL_ASYNC_ERROR_HANDLING: "1"       # Better async error handling
    NCCL_TIMEOUT: "1800"                 # 30 min timeout for large barrier ops
    # PyTorch distributed settings
    TORCH_DISTRIBUTED_DEBUG: "DETAIL"    # More verbose debugging
    TORCH_NCCL_BLOCKING_WAIT: "1"        # Use blocking wait for better error reporting
    # Increase TCP store timeout for multi-node coordination
    TORCH_DIST_INIT_BARRIER_TIMEOUT: "1800"
  dependencies: dependencies.yaml
compute:
  gpus: 16
  gpu_type: h100
max_retries: 0
code_source:
  type: snapshot
  snapshot:
    # git_branch: sgc_cli_guanyu
    # git_commit: 9de28424209f0950c9d3204967e8742a7ac5a148
    allow_uncommitted: true
    repo_path: /Users/guanyu.chen/Documents/Projects/composer_geneformer_pretrain/
command: |-
  cd $HOME/composer_geneformer_pretrain/SGC_geneformer_mlflow_hang_test
  echo ">>> In final training folder"
  sh commands.sh
  echo ">>> Starting training" 
  export NODENAME="node_$NODE_RANK"
  composer train.py parameters.yaml
