experiment_name: torchrun-hello-world-guanyu
environment:
  env_variables:
    NCCL_DEBUG: "INFO"
  dependencies: dependencies.yaml
compute:
  gpus: 2
  gpu_type: a10
max_retries: 0
command: |-

  # Use the absolute path to the script within the repo snapshot on the driver.
  TRAIN_SCRIPT="/databricks/driver/composer_geneformer_pretrain_ref/composer_geneformer_pretrain/hello_world/train_guanyu.py"

  torchrun \
    --nnodes=1 \
    --nproc_per_node=2 \
    --node_rank=$NODE_RANK \
    --master_addr=$MASTER_ADDR \
    --master_port=$MASTER_PORT \
    $TRAIN_SCRIPT
