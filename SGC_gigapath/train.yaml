experiment_name: gigapath-sgc-repo-guanyu
environment:
  env_variables:
    NCCL_DEBUG: "INFO"
    NCCL_SOCKET_IFNAME: "eth"
    NCCL_IB_DISABLE: "1"
    NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_TIMEOUT: "1800"
    TORCH_NCCL_BLOCKING_WAIT: "1"
    TORCH_DIST_INIT_BARRIER_TIMEOUT: "1800"
    # Optional: set HuggingFace token only if using pretrained hub weights.
    # HF_TOKEN: "<your_hf_token>"
    GIGAPATH_ROOT_PATH: /Volumes/main/guanyu_chen/sgc/gigapath/data/dinov2_features/GigaPath_PANDA_embeddings/h5_files
    GIGAPATH_OUTPUT_DIR: /Volumes/main/guanyu_chen/sgc/gigapath/outputs/
    GIGAPATH_EPOCHS: "35"
    GIGAPATH_SAVE_INTERVAL_EPOCHS: "5"
    GIGAPATH_AUTORESUME: "1"
    # Empty => random init. Set to hf_hub:prov-gigapath/prov-gigapath to load pretrained.
    GIGAPATH_PRETRAINED: /Volumes/main/guanyu_chen/sgc/gigapath/model/slide_encoder.pth
  dependencies: dependencies.yaml
compute:
  gpus: 16
  gpu_type: h100
max_retries: 0
code_source:
  type: snapshot
  snapshot:
    repo_path: /Users/guanyu.chen/Documents/Projects/composer_geneformer_pretrain/
command: |-
  cd $HOME/composer_geneformer_pretrain/SGC_gigapath
  bash commands.sh
