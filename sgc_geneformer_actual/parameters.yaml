model_config:
  hidden_size: 256
  num_hidden_layers: 6
  initializer_range: 0.02
  layer_norm_eps: 1e-12
  attention_probs_dropout_prob: 0.02
  hidden_dropout_prob: 0.02
  intermediate_size: 512
  hidden_act: relu
  max_position_embeddings: 2048
  model_type: bert
  num_attention_heads: 4

fsdp_config:
  sharding_strategy: FULL_SHARD
  state_dict_type: full
  cpu_offload: False 
  mixed_precision: DEFAULT
  backward_prefetch: BACKWARD_POST
  activation_checkpointing: False
  activation_cpu_offload: False
  verbose: True

# Optimization
scheduler:
  name: linear_decay_with_warmup
  t_warmup: 0.06dur # Warmup to the full LR for 6% of the training duration
  alpha_f: 0.02 # Linearly decay to 0.02x the full LR by the end of the training duration

optimizer:
  name: decoupled_adamw
  lr: 5.0e-4 # Peak learning rate
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-5 # Amount of weight decay regularization

callbacks:
  speed_monitor:
    window_size: 500
  lr_monitor: {}
  memory_monitor: {}  # for monitoring model memory usage in gpu

#make sure you have configured databricks secret | overwritten by train.yaml
loggers:
  mlflow:
    tracking_uri: databricks
    # tracking_uri: databricks-uc  # Not supported in MLflow 2.22.4
    experiment_name: mlflow_experiments/geneformer_pretraining

device : gpu
seed_val : 42
run_name : geneformer_pretrain ##to add timestamp to the run name
working_dir : /pretrain/temp  

# Streaming Dataset
data_location : remote #local vs remote
local_data_dir : /Geneformer/data
data_bucket_name : srijit-nair-sandbox-bucket
data_bucket_key : geneformer/data
token_dictionary_filename : token_dictionary.pkl
streaming_dataset_location : streaming/genecorpus_30M_2048.dataset
mlm_probability: 0.15
# Training 
train_batch_size: 16
eval_batch_size: 16
device_train_microbatch_size : 16
train_subset_num_batches : 100
eval_subset_num_batches : 10
max_duration: 1ep #20ep #drives how many epochs Composer will train before stopping
eval_interval: 1ep #10ep
# Logging
progress_bar: false
log_to_console: true
console_log_interval: 1ba

# Auto resume disabled to avoid resuming a run that already completed 20ep.
autoresume : False

#Checkpoint to local volume (S3 commented out due to credentials issue)
save_interval: 20ep
save_num_checkpoints_to_keep: 3 
save_overwrite: True #overwrite checkpoint if exists
#save_folder: "dbfs:/databricks/mlflow-tracking/{mlflow_experiment_id}/{mlflow_run_id}/artifacts/"
#save_folder: "s3://srijit-nair-sandbox-bucket/geneformer/pretrain/demo/restart/checkpoints/full"
# save_folder: "/Volumes/main/guanyu_chen/sgc/checkpoints/20eps/"
save_folder: "/Volumes/main/srijit_nair/geneformer/tmp/geneformer_sgcli_mmt_test/checkpoints/"