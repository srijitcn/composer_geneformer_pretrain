experiment_name: merck-dep-test
env_variables:
    NCCL_DEBUG: "INFO"
environment:
  dependencies: dependencies.yaml
compute:
  gpus: 64
  gpu_type: H100
max_retries: 0
code_source:
  type: snapshot
  snapshot:
    repo_path: /Workspace/Shared/test/sgc_cli
command: |-
  echo ">>> Starting dependency compatibility test"
  echo ">>> CODE_SOURCE_PATH=$CODE_SOURCE_PATH"

  cd $CODE_SOURCE_PATH
  python test_deps.py
