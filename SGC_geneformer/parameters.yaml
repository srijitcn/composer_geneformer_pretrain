model_config:
  hidden_size: 256
  num_hidden_layers: 6
  initializer_range: 0.02
  layer_norm_eps: 1e-12
  attention_probs_dropout_prob: 0.02
  hidden_dropout_prob: 0.02
  intermediate_size: 512
  hidden_act: relu
  max_position_embeddings: 2048
  model_type: bert
  num_attention_heads: 4

fsdp_config:
  sharding_strategy: FULL_SHARD
  state_dict_type: full
  cpu_offload: False 
  mixed_precision: DEFAULT
  backward_prefetch: BACKWARD_POST
  activation_checkpointing: False
  activation_cpu_offload: False
  verbose: True

# Optimization
scheduler:
  name: linear_decay_with_warmup
  t_warmup: 0.06dur # Warmup to the full LR for 6% of the training duration
  alpha_f: 0.02 # Linearly decay to 0.02x the full LR by the end of the training duration

optimizer:
  name: decoupled_adamw
  lr: 5.0e-4 # Peak learning rate
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-5 # Amount of weight decay regularization

callbacks:
  speed_monitor:
    window_size: 500
  lr_monitor: {}
  memory_monitor: {}  # for monitoring model memory usage in gpu

#make sure you have configured databricks secret
loggers:
  mlflow:
    tracking_uri: databricks
    experiment_name: mlflow_experiments/geneformer_pretraining

device : gpu
seed_val : 42
run_name : geneformer_pretrain
working_dir : /pretrain/temp  

# ============================================
# Databricks Volume Configuration
# ============================================
# Volume path is constructed as: /Volumes/{catalog}/{schema}/{volume_name}
volume:
  catalog: main
  schema: guanyu_chen
  volume_name: sgc

# Data paths relative to the volume root
data:
  # Source dataset (HuggingFace format) - used for MDS preparation
  source_dataset: geneformer/data/dataset/genecorpus_30M_2048.dataset
  # Streaming dataset location (MDS format) - will be created if not exists
  streaming_dataset: geneformer/data/dataset/streaming/genecorpus_30M_2048.dataset
  # Token dictionary file
  token_dictionary: geneformer/data/token_dictionary.pkl
  # Test split ratio for train/test split
  test_split_ratio: 0.1

# Checkpoint path relative to volume root
checkpoints:
  folder: geneformer/checkpoints

# ============================================
# Training Configuration
# ============================================
mlm_probability: 0.15
train_batch_size: 16
eval_batch_size: 16
device_train_microbatch_size: 16
train_subset_num_batches: 512  # -1 means use all batches
eval_subset_num_batches: 128   # -1 means use all batches
max_duration: 150ep
eval_interval: 10ep

# Logging
progress_bar: false
log_to_console: true
console_log_interval: 1ba

# Auto resume
autoresume: True

# ============================================
# Failure Test Configuration (for testing checkpoint recovery)
# ============================================
# Enable this to intentionally fail training at a specific epoch
# to test that autoresume correctly picks up from the last checkpoint.
# After max_failures, training will continue normally.
failure_test:
  enabled: false          # Set to true to enable failure testing
  fail_at_epoch: 7        # Epoch at which to trigger failure (0-indexed)
  max_failures: 3         # Fail this many times, then continue normally
  # failure_counter_path: auto  # Optional: defaults to checkpoint_folder/failure_counter.json

# Checkpoint settings
save_interval: 10ep
save_num_checkpoints_to_keep: 100
save_overwrite: True
