experiment_name: torchrun-hello-world
env_variables:
    NCCL_DEBUG: "INFO"
environment:
  dependencies: dependencies.yaml
compute:
  gpus: 8
  gpu_type: H100
max_retries: 0
code_source:
  type: snapshot
  snapshot:
    # allow_uncommitted: true
    # repo_path is local path for your repo, and changes git commit is required for job submission
    repo_path: /Users/guanyu.chen/Documents/Projects/composer_geneformer_pretrain/
command: |-
  echo "HOME=$HOME"                                                                                                                                                                                                                                                                                         
  echo "CODE_SOURCE_PATH=${CODE_SOURCE_PATH:-UNSET}"                                                                                                                                                                                                                                                        
  echo "--- ls -la \$HOME ---"                                                                                                                                                                                                                                                                              
  ls -la "$HOME"                                                                                                                                                                                                                                                                                            
  echo "--- ls -la \$CODE_SOURCE_PATH ---"                                                                                                                                                                                                                                                                  
  ls -la "${CODE_SOURCE_PATH:-/databricks/code_source}" 2>&1 | head -30                                                                                                                                                                                                                                     
  echo "--- readlink any symlinks in \$HOME ---"                                                                                                                                                                                                                                                            
  for f in "$HOME"/*; do [ -L "$f" ] && echo "$f -> $(readlink "$f")"; done
  
  echo ">>> In SGC_hello_world folder, starting training"
  
  #Repo is in $HOME, so cd relative to $HOME
  cd $HOME/composer_geneformer_pretrain/SGC_hello_world
  
  torchrun \
    --nnodes=1 \
    --nproc_per_node=8 \
    --node_rank=$NODE_RANK \
    --master_addr=$MASTER_ADDR \
    --master_port=$MASTER_PORT \
    train_hello_world.py
